# Render blueprint. Point Render at this repo and it provisions the API.
#
# Only the API lives here. The frontend is on Vercel — declaring it here too
# would build the same site twice and leave two live URLs drifting apart.
#
# No database is declared either: the app runs on Supabase, so Render hosts
# nothing but the web service. Every value marked sync:false is entered in the
# Render dashboard and deliberately never stored in this file.
services:
  - type: web
    name: asm-api
    runtime: python
    rootDir: backend
    # Singapore is the closest region Render offers to Supabase's ap-south-1
    # (Mumbai). Each request makes several database round-trips, so hosting
    # the API in Oregon or Frankfurt would add hundreds of milliseconds to
    # every page — the distance costs far more than the compute.
    region: singapore
    # Free instances sleep after 15 minutes without an inbound request and
    # take about a minute to wake. .github/workflows/keep-alive.yml pings
    # /api/health every 10 minutes to prevent that.
    #
    # The budget is 750 instance-hours per workspace per calendar month, and
    # staying awake around the clock costs ~744 in a 31-day month. That is the
    # entire allowance for the whole workspace, not just this service: spin up
    # a second free service and Render suspends BOTH until the month rolls
    # over. Moving to `starter` removes the limit, the sleeping, and the need
    # for the keep-alive workflow at once.
    plan: free
    # Migrations belong in preDeployCommand — it runs once per deploy, after
    # the build and before traffic shifts. That field is paid-only, so on the
    # free tier they ride along with the build instead. Two consequences worth
    # knowing: this runs on every build even when nothing changed (harmless,
    # `upgrade head` is a no-op when already current), and the schema migrates
    # before the new code is confirmed good, so a failed deploy leaves a
    # migrated database serving the previous release. Keep migrations
    # backwards-compatible with the running version and that stays safe.
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"

      # Supabase TRANSACTION pooler, port 6543. Not the direct connection —
      # that is IPv6-only and unreachable from Render.
      - key: DATABASE_URL
        sync: false
      # Supabase SESSION pooler, port 5432. Alembic needs session state and
      # advisory locks that the transaction pooler cannot hold, so the
      # migration step above would hang or half-apply without this.
      - key: DATABASE_MIGRATION_URL
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false
      # The whole service-account JSON on one line.
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false

      # The Vercel URL, no trailing slash:
      #   https://asm-lungi-company.vercel.app
      # Vercel also gives every deploy its own preview hostname, which this
      # does not cover — preview builds will fail CORS against this API.
      - key: CORS_ORIGINS
        sync: false

      # Never true on a deployed environment. app/main.py refuses to start if
      # it finds this on while a hosting platform is detected; it is set here
      # explicitly so nobody has to wonder.
      - key: AUTH_DEV_BYPASS
        value: "false"
