# Render blueprint. Point Render at this repo and it provisions the API.
#
# No database is declared here: the app runs on Supabase, so Render only hosts
# the web service. Every value marked sync:false is entered in the Render
# dashboard and deliberately never stored in this file.
services:
  - type: web
    name: asm-api
    runtime: python
    rootDir: backend
    # Singapore is the closest region Render offers to Supabase's ap-south-1
    # (Mumbai). Each request makes several database round-trips, so hosting
    # the API in Oregon or Frankfurt would add hundreds of milliseconds to
    # every page — the distance costs far more than the compute.
    region: singapore
    # Free instances sleep after 15 minutes idle and take 30-60s to wake. For
    # a tool someone opens a few times a day that means a cold start almost
    # every time, so this is on the paid tier deliberately.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Migrations run at release, not build: the build step has no database
    # attached, and putting them in the start command would re-run them on
    # every restart and autoscale.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"

      # Supabase TRANSACTION pooler, port 6543. Not the direct connection —
      # that is IPv6-only and unreachable from Render.
      - key: DATABASE_URL
        sync: false
      # Supabase SESSION pooler, port 5432. Alembic needs session state and
      # advisory locks that the transaction pooler cannot hold, so
      # preDeployCommand above would hang or half-apply without this.
      - key: DATABASE_MIGRATION_URL
        sync: false

      - key: FIREBASE_PROJECT_ID
        sync: false
      # The whole service-account JSON on one line.
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false

      # Your Vercel URL, e.g. https://asm-lungi.vercel.app — no trailing slash.
      - key: CORS_ORIGINS
        sync: false

      # Never true on a deployed environment. app/main.py refuses to start if
      # it finds this on while a hosting platform is detected; it is set here
      # explicitly so nobody has to wonder.
      - key: AUTH_DEV_BYPASS
        value: "false"

  - type: web
    name: asm-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # The app routes on the client, so a visitor loading /salary directly — or
    # refreshing anywhere other than the home page — asks the server for a file
    # that does not exist. Without this rewrite that is a 404; with it, every
    # path serves index.html and the router takes over.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        # Vite fingerprints these filenames, so a changed file is a changed URL
        # and the old one can be cached indefinitely.
        value: public, max-age=31536000, immutable
    envVars:
      # The API's URL. Vite inlines this at BUILD time, so changing it needs a
      # redeploy — restarting is not enough. Deploy the API first so this can
      # be set correctly the first time.
      - key: VITE_API_BASE_URL
        sync: false
      # Firebase web config. Public by design — it ships inside the JS bundle
      # and only identifies the project. Access is decided by the backend.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
