# Render blueprint. Point Render at this repo and it provisions both the API
# and its database. Secrets marked sync:false must be entered in the Render
# dashboard — they are deliberately not stored in this file.
services:
  - type: web
    name: asm-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations run at release, not build: the build step has no database
    # attached, and running them in the start command would re-run on every
    # autoscale or restart.
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: DATABASE_URL
        fromDatabase:
          name: asm-db
          property: connectionString
      - key: AUTH_DEV_BYPASS
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
      # Your Vercel URL, e.g. https://asm-lungi.vercel.app
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: asm-db
    plan: free
