# Keeps the free Render API awake.
#
# Render spins a free web service down after 15 minutes with no inbound
# request, and waking it takes about a minute — long enough that the first
# person to open the app each morning assumes it is broken. This pings the
# unauthenticated health endpoint often enough that the idle timer never runs
# out.
#
# SETUP: Settings -> Secrets and variables -> Actions -> Variables -> New
# repository variable, named RENDER_API_URL, e.g.
#   https://asm-api.onrender.com
# No trailing slash. It is a public URL, so a variable is right here, not a
# secret — secrets are masked in logs, which makes failures harder to read.
#
# TWO THINGS THAT WILL BITE:
#
# 1. GitHub disables scheduled workflows in a repository after 60 days with no
#    commits, without warning. A quiet stretch on the project silently stops
#    the pings and the API goes back to sleeping. If the repo goes quiet, use
#    an external pinger (cron-job.org, UptimeRobot) instead.
#
# 2. `schedule` is best-effort, not guaranteed. Runs are queued and can be
#    delayed by several minutes when GitHub is busy — worst around the top of
#    the hour, which is why the times below are offset. A 10-minute interval
#    against a 15-minute timeout absorbs a 5-minute delay; a longer one lets
#    the service sleep. This is the weak point of doing it this way.
name: keep-alive

on:
  schedule:
    # Every 10 minutes, offset off the hour to dodge peak scheduling load.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: # lets you trigger a wake-up by hand from the Actions tab

# Nothing here touches the repository.
permissions: {}

concurrency:
  # A delayed run and an on-time run can otherwise overlap; the newer ping is
  # the useful one.
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          set -euo pipefail

          if [ -z "${API_URL}" ]; then
            echo "::error::RENDER_API_URL repository variable is not set."
            echo "Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

          # --retry-connrefused and the generous timeout cover the cold start:
          # if the service did manage to fall asleep, this request is the one
          # waking it, and that takes ~60s rather than the usual few hundred ms.
          http_code=$(
            curl --silent --show-error --location \
                 --retry 3 --retry-delay 20 --retry-connrefused \
                 --max-time 90 \
                 --write-out '%{http_code}' \
                 --output /tmp/health.json \
                 "${API_URL}/api/health"
          )

          echo "HTTP ${http_code}"
          cat /tmp/health.json || true
          echo

          if [ "${http_code}" != "200" ]; then
            echo "::error::Health check returned ${http_code}, expected 200."
            exit 1
          fi
